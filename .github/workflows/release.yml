name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.0). Leave blank to use cove/__init__.py.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Linux AppImage ─────────────────────────────────────────────────────
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AppImage build tooling
        run: |
          sudo apt-get update
          # libfuse2 is required for the appimagetool AppImage to execute.
          sudo apt-get install -y --no-install-recommends libfuse2 desktop-file-utils
          python -m pip install --upgrade pip
          python -m pip install --user python-appimage
          # build.sh expects appimagetool either at python-appimage's cache
          # path or on PATH. python-appimage --no-packaging skips fetching
          # it, so we install it ourselves into /usr/local/bin.
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build AppImage
        run: |
          export PYAPPIMG="$HOME/.local/bin/python-appimage"
          bash build.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  # ── Linux .deb ─────────────────────────────────────────────────────────
  deb:
    name: Build .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OS build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xz-utils

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-deb.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: release/cove-download-manager_${{ steps.ver.outputs.version }}_amd64.deb
          if-no-files-found: error

  # ── Windows Setup.exe + Portable.exe (native, no Wine) ────────────────
  aria2-windows:
    name: Build patched Windows aria2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned aria2 source with WinTLS patch
        run: bash scripts/build-aria2-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win/
          if-no-files-found: error

  windows:
    name: Build Windows installers
    needs: aria2-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate cove_icon.ico
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('cove_icon.png').save('cove_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Download patched aria2 backend
        uses: actions/download-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win

      - name: Test patched aria2 TLS policy
        shell: pwsh
        run: scripts/test-aria2-windows-tls.ps1 -Aria2Exe build/aria2-win/aria2c.exe

      - name: Fetch yt-dlp.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/yt-dlp-win | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile build/yt-dlp-win/yt-dlp.exe
          if (-not (Test-Path build/yt-dlp-win/yt-dlp.exe)) { throw "yt-dlp.exe download failed" }

      - name: PyInstaller (one-dir for installer)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed `
            --icon cove_icon.ico `
            --name cove-download-manager `
            --paths . `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onedir/dist `
            --workpath build/win-onedir/work `
            packaging/launcher.py
          if (-not (Test-Path "build/win-onedir/dist/cove-download-manager")) { throw "one-dir bundle missing" }
          Copy-Item cove_icon.png build/win-onedir/dist/cove-download-manager/
          if (Test-Path README.md) { Copy-Item README.md build/win-onedir/dist/cove-download-manager/ }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   build/win-onedir/dist/cove-download-manager/ }

      - name: PyInstaller (one-file portable)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed --onefile `
            --icon cove_icon.ico `
            --name cove-download-manager-portable `
            --paths . `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onefile/dist `
            --workpath build/win-onefile/work `
            packaging/portable_launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src  = (Resolve-Path "build/win-onedir/dist/cove-download-manager").Path
          $out  = (Resolve-Path "release").Path
          $icon = (Resolve-Path "cove_icon.ico").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=$src" `
            "/DOutputDir=$out" `
            "/DIconFile=$icon" `
            packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Stage portable
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $portSrc = "build/win-onefile/dist/cove-download-manager-portable.exe"
          $portDst = "release/Cove-Download-Manager-$version-Portable.exe"
          Copy-Item -Force $portSrc $portDst
          $clientStage = "build/client-stage/cove-api"
          New-Item -ItemType Directory -Force -Path $clientStage | Out-Null
          Copy-Item tools/cove-api/cove-api.cmd $clientStage/
          Copy-Item tools/cove-api/cove_api.py $clientStage/
          Copy-Item tools/cove-api/wrapper_config.json $clientStage/
          Copy-Item tools/cove-api/README.md $clientStage/
          Copy-Item tools/cove-api/AI_WRAPPER_OPERATING_RULES.md $clientStage/
          Copy-Item tools/cove-api/AI_DIRECT_API_OPERATING_RULES.md $clientStage/
          Compress-Archive -Path "$clientStage/*" -DestinationPath "release/Cove-AI-Client-$version.zip" -Force
          Copy-Item build/aria2-win/aria2-1.37.0-cove.1-source.tar.gz release/
          Get-ChildItem release | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Setup.exe
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Portable.exe
            release/Cove-AI-Client-${{ steps.ver.outputs.version }}.zip
            release/aria2-1.37.0-cove.1-source.tar.gz
          if-no-files-found: error

  # ── Publish GitHub release ─────────────────────────────────────────────
  publish:
    name: Publish GitHub release
    needs: [appimage, deb, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          # The aria2-windows artifact is a build intermediate; its exe is
          # already bundled inside Setup.exe and Portable.exe.
          rm -f release/aria2c.exe
          ls -la release/

      - name: Generate SHA256 sidecars
        run: |
          cd release
          for f in *.exe *.AppImage *.deb *.zip *.tar.gz; do
            [ -e "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'NOTESEOF'
          ## What's new in 3.3.1

          Cove can now be set as your magnet link handler from inside Settings, and keeps that registration working after an update.

          ### Added

          - **Magnet registration from Settings.** A new "Magnet links" row in Settings registers Cove as your magnet handler with no terminal command. On Linux it sets the default and confirms the result with your desktop before claiming success. On Windows it registers Cove and opens Settings at Cove's own entry, because since Windows 10 no application is allowed to make itself the default; the final choice stays yours.
          - **Honest, live status.** The row reports what the operating system currently says, not what Cove would prefer, so a default you changed in another application shows up immediately. It is deliberately not a checkbox: a ticked box would keep claiming Cove was the default after you closed Windows Settings without picking it.
          - **Registration survives updates.** The portable `.exe` and the AppImage carry their version in the filename, so updating used to leave the registration pointing at a file that no longer exists. Cove now repairs its own registration the next time the updated build is launched. It never silently reclaims a default you have since given to another application.
          - **A one-time offer.** The first time you add a magnet or torrent by hand, Cove offers to handle magnet links. It asks once and remembers your answer either way.
          - **Close to system tray.** Off by default, in Settings -> Window. The window X hides Cove to the tray instead of quitting, so the browser extension can still hand downloads to it. The tray menu has Open Cove and Quit Cove.

          ### Fixed

          - **Settings could be corrupted by two saves at once.** Cove wrote to a single shared temporary file before replacing the real one, so two saves happening together could publish a half-written file and lose your stored settings, including the local API secret. Each save now uses its own temporary file and saves are serialised.
          - **"Remove Cove registration" could report success while doing nothing.** After updating the portable build, the recorded registration belonged to the older executable, so nothing was removed even though Cove said it had been. It now tells you the registration belongs to a different copy of Cove and leaves it untouched.
          - **A declined magnet prompt could be silently overridden.** A background check running at startup could turn a "no" into a "yes" if you answered while it was still working.
          - **Debian installs no longer claim to be registered when they are not.** The status now checks that the packaged desktop entry is actually installed.
          - **Running from source no longer tries to register.** The path it would record belongs to the Python interpreter, not to Cove, so registration is refused and Settings explains why.

          ### Notes

          - Account-required YouTube content such as members-only or private videos is still not downloadable through the extension, since browser cookies are not forwarded for YouTube.
          - If you delete an old portable `.exe` or AppImage and click a magnet link before ever launching the new build, Cove has not run yet and cannot repair anything.

          ## Downloads

          | Platform | File |
          |----------|------|
          | Linux (AppImage) | `Cove-Download-Manager-VERSION-x86_64.AppImage` |
          | Linux (Debian/Ubuntu) | `cove-download-manager_VERSION_amd64.deb` |
          | Windows installer | `Cove-Download-Manager-VERSION-Setup.exe` |
          | Windows portable | `Cove-Download-Manager-VERSION-Portable.exe` |
          | AI command-line client | `Cove-AI-Client-VERSION.zip` |
          | Patched aria2 source | `aria2-1.37.0-cove.1-source.tar.gz` |

          Each artifact has a matching `.sha256` file for verification.
          NOTESEOF
          sed -i "s/VERSION/${VERSION}/g" "$NOTES_FILE"

          if gh release view "v$VERSION" &>/dev/null; then
            gh release upload "v$VERSION" release/* --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --draft \
              -F "$NOTES_FILE" \
              release/*
          fi
