name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.0). Leave blank to use cove/__init__.py.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Linux AppImage ─────────────────────────────────────────────────────
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AppImage build tooling
        run: |
          sudo apt-get update
          # libfuse2 is required for the appimagetool AppImage to execute.
          sudo apt-get install -y --no-install-recommends libfuse2 desktop-file-utils
          python -m pip install --upgrade pip
          python -m pip install --user python-appimage
          # build.sh expects appimagetool either at python-appimage's cache
          # path or on PATH. python-appimage --no-packaging skips fetching
          # it, so we install it ourselves into /usr/local/bin.
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build AppImage
        run: |
          export PYAPPIMG="$HOME/.local/bin/python-appimage"
          bash build.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  # ── Linux .deb ─────────────────────────────────────────────────────────
  deb:
    name: Build .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OS build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xz-utils

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-deb.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: release/cove-download-manager_${{ steps.ver.outputs.version }}_amd64.deb
          if-no-files-found: error

  # ── Windows Setup.exe + Portable.exe (native, no Wine) ────────────────
  aria2-windows:
    name: Build patched Windows aria2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned aria2 source with WinTLS patch
        run: bash scripts/build-aria2-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win/
          if-no-files-found: error

  windows:
    name: Build Windows installers
    needs: aria2-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate cove_dm_icon.ico
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('cove_dm_icon.png').save('cove_dm_icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Download patched aria2 backend
        uses: actions/download-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win

      - name: Test patched aria2 TLS policy
        shell: pwsh
        run: scripts/test-aria2-windows-tls.ps1 -Aria2Exe build/aria2-win/aria2c.exe

      - name: Fetch yt-dlp.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/yt-dlp-win | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile build/yt-dlp-win/yt-dlp.exe
          if (-not (Test-Path build/yt-dlp-win/yt-dlp.exe)) { throw "yt-dlp.exe download failed" }

      - name: PyInstaller (one-dir for installer)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed `
            --icon cove_dm_icon.ico `
            --name cove-download-manager `
            --paths . `
            --add-data "cove_dm_icon.png;cove" `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onedir/dist `
            --workpath build/win-onedir/work `
            packaging/launcher.py
          if (-not (Test-Path "build/win-onedir/dist/cove-download-manager")) { throw "one-dir bundle missing" }
          Copy-Item cove_dm_icon.png build/win-onedir/dist/cove-download-manager/
          if (Test-Path README.md) { Copy-Item README.md build/win-onedir/dist/cove-download-manager/ }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   build/win-onedir/dist/cove-download-manager/ }

      - name: PyInstaller (one-file portable)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed --onefile `
            --icon cove_dm_icon.ico `
            --name cove-download-manager-portable `
            --paths . `
            --add-data "cove_dm_icon.png;cove" `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onefile/dist `
            --workpath build/win-onefile/work `
            packaging/portable_launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src  = (Resolve-Path "build/win-onedir/dist/cove-download-manager").Path
          $out  = (Resolve-Path "release").Path
          $icon = (Resolve-Path "cove_dm_icon.ico").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=$src" `
            "/DOutputDir=$out" `
            "/DIconFile=$icon" `
            packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Stage portable
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $portSrc = "build/win-onefile/dist/cove-download-manager-portable.exe"
          $portDst = "release/Cove-Download-Manager-$version-Portable.exe"
          Copy-Item -Force $portSrc $portDst
          $clientStage = "build/client-stage/cove-api"
          New-Item -ItemType Directory -Force -Path $clientStage | Out-Null
          Copy-Item tools/cove-api/cove-api.cmd $clientStage/
          Copy-Item tools/cove-api/cove_api.py $clientStage/
          Copy-Item tools/cove-api/wrapper_config.json $clientStage/
          Copy-Item tools/cove-api/README.md $clientStage/
          Copy-Item tools/cove-api/AI_WRAPPER_OPERATING_RULES.md $clientStage/
          Copy-Item tools/cove-api/AI_DIRECT_API_OPERATING_RULES.md $clientStage/
          Compress-Archive -Path "$clientStage/*" -DestinationPath "release/Cove-AI-Client-$version.zip" -Force
          Copy-Item build/aria2-win/aria2-1.37.0-cove.1-source.tar.gz release/
          Get-ChildItem release | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Setup.exe
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Portable.exe
            release/Cove-AI-Client-${{ steps.ver.outputs.version }}.zip
            release/aria2-1.37.0-cove.1-source.tar.gz
          if-no-files-found: error

  # ── Publish GitHub release ─────────────────────────────────────────────
  publish:
    name: Publish GitHub release
    needs: [appimage, deb, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          # The aria2-windows artifact is a build intermediate; its exe is
          # already bundled inside Setup.exe and Portable.exe.
          rm -f release/aria2c.exe
          ls -la release/

      - name: Generate SHA256 sidecars
        run: |
          cd release
          for f in *.exe *.AppImage *.deb *.zip *.tar.gz; do
            [ -e "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'NOTESEOF'
          ## What's new in 3.5.2

          A correctness release. An audit of the codebase turned up twenty-one confirmed defects, and this fixes all of them. Nothing here is a new feature; several are problems you could hit without ever knowing why, which is the reason for shipping them on their own rather than folding them into the next feature release.

          ### Fixed

          - **A removed download can no longer come back.** Cancelling an unfinished download asks aria2 to let go of it first, and only then clears the row - so a cancellation aria2 refuses leaves the download intact instead of losing track of a transfer that is still running. Quitting or crashing inside that window used to restore the download on the next launch and start it again; the row now records that it is on its way out, and startup finishes the job.
          - **Pause and resume no longer drift out of step with aria2.** Cove sends one pause or resume per download at a time and waits for the answer before sending another. Two commands issued together could be applied by aria2 in the opposite order to the one they were sent in, leaving a download running while Cove showed it paused, or paused while Cove showed it running, with nothing to correct it. Cove now compares what you asked for against what aria2 last reported and re-sends the difference.
          - **A download you paused stays paused across a restart.** Startup restored paused downloads as queued, so they resumed on their own.
          - **Video download progress no longer stalls.** ffmpeg ends each progress line with a carriage return rather than a newline, and the reader was waiting for a newline that only arrived with unrelated output - so the bar sat still and then jumped, reporting an old position when it did move.
          - **Cancelling an update no longer freezes Cove.** Cancel closed the network response directly from the interface thread, which then waited on the download thread's read for up to twenty seconds - the exact hang Cancel is there to end. It now interrupts the transfer without blocking the interface.
          - **Cancelling an update no longer installs it anyway.** A Cancel arriving as the final chunk of the download completed was not noticed, and Cove replaced the executable and relaunched into the update you had just called off. Cancellation is now checked again before the download reports success, and once more before anything is replaced.
          - **A corrupted settings file no longer crashes Cove or silently inverts a setting.** Values loaded from disk are type-checked at the boundary, including category directories and the schedule window. Recognising a key was previously all the loader did, and a non-empty `"false"` read as true.
          - **Torrent files are written safely when two saves overlap.** Each save uses its own scratch file rather than a shared one two writers could truncate, and every byte is written rather than assuming a single write suffices.
          - **Failed TorBox jobs are released.** Only a poll timeout freed the job, so failed attempts accumulated on your account.

          ### Also in this release

          - **Browsers installed only as Flatpaks now get a native-messaging manifest.** They have no conventional config directory, so they were previously skipped entirely and the browser extension could not reach Cove at all.
          - **The extension badge shows OFF when Cove is disabled**, rather than being overwritten by a media count.
          - **Support logs respect their size cap** with non-ASCII text. Rotation counted characters rather than bytes, so a log could grow well past its limit.
          - **The single-instance lock lives in a private per-user directory**, checked before use so it cannot be redirected through a planted symlink, and an unusable lock file is reported as such instead of as an already-running Cove.
          - **Checking whether Cove is your magnet handler no longer briefly freezes the window.** It runs off the interface thread, as the account test already did.
          - **An installed copy has its icons.** They were staged only in the source checkout, so a wheel installed from PyPI had none. Python 3.10 is now declared as the minimum, which is what the code has required since it started using newer type syntax.

          ### Notes

          - Two audit findings were examined and rejected rather than fixed. The Windows native-messaging `.bat` wrapper is the documented approach for Firefox on Windows, and Debian handler detection does query the desktop association - the reported causes were not real.
          - One known limit is deliberate: if Cove is killed during the moment between asking aria2 to cancel a download and aria2 confirming it, the partial file is left on disk. Cleaning it up blindly at startup risks deleting a file a still-running transfer would immediately recreate.
          - Browser extension: unchanged at Firefox 1.4.6 and Chrome 1.3.7. The extension fixes above are in the source but not yet in a published store build; they ship with the next store submission, which is manual and separate from this release.

          ## Downloads

          | Platform | File |
          |----------|------|
          | Linux (AppImage) | `Cove-Download-Manager-VERSION-x86_64.AppImage` |
          | Linux (Debian/Ubuntu) | `cove-download-manager_VERSION_amd64.deb` |
          | Windows installer | `Cove-Download-Manager-VERSION-Setup.exe` |
          | Windows portable | `Cove-Download-Manager-VERSION-Portable.exe` |
          | AI command-line client | `Cove-AI-Client-VERSION.zip` |
          | Patched aria2 source | `aria2-1.37.0-cove.1-source.tar.gz` |

          Each artifact has a matching `.sha256` file for verification.
          NOTESEOF
          sed -i "s/VERSION/${VERSION}/g" "$NOTES_FILE"

          if gh release view "v$VERSION" &>/dev/null; then
            gh release upload "v$VERSION" release/* --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --draft \
              -F "$NOTES_FILE" \
              release/*
          fi
