name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.0). Leave blank to use cove/__init__.py.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Linux AppImage ─────────────────────────────────────────────────────
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AppImage build tooling
        run: |
          sudo apt-get update
          # libfuse2 is required for the appimagetool AppImage to execute.
          sudo apt-get install -y --no-install-recommends libfuse2 desktop-file-utils
          python -m pip install --upgrade pip
          python -m pip install --user python-appimage
          # build.sh expects appimagetool either at python-appimage's cache
          # path or on PATH. python-appimage --no-packaging skips fetching
          # it, so we install it ourselves into /usr/local/bin.
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build AppImage
        run: |
          export PYAPPIMG="$HOME/.local/bin/python-appimage"
          bash build.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  # ── Linux .deb ─────────────────────────────────────────────────────────
  deb:
    name: Build .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OS build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xz-utils

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-deb.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: release/cove-download-manager_${{ steps.ver.outputs.version }}_amd64.deb
          if-no-files-found: error

  # ── Windows Setup.exe + Portable.exe (native, no Wine) ────────────────
  aria2-windows:
    name: Build patched Windows aria2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned aria2 source with WinTLS patch
        run: bash scripts/build-aria2-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win/
          if-no-files-found: error

  windows:
    name: Build Windows installers
    needs: aria2-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate cove_dm_icon.ico
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('cove_dm_icon.png').save('cove_dm_icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Download patched aria2 backend
        uses: actions/download-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win

      - name: Test patched aria2 TLS policy
        shell: pwsh
        run: scripts/test-aria2-windows-tls.ps1 -Aria2Exe build/aria2-win/aria2c.exe

      - name: Fetch yt-dlp.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/yt-dlp-win | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile build/yt-dlp-win/yt-dlp.exe
          if (-not (Test-Path build/yt-dlp-win/yt-dlp.exe)) { throw "yt-dlp.exe download failed" }

      - name: PyInstaller (one-dir for installer)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed `
            --icon cove_dm_icon.ico `
            --name cove-download-manager `
            --paths . `
            --add-data "cove_dm_icon.png;cove" `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onedir/dist `
            --workpath build/win-onedir/work `
            packaging/launcher.py
          if (-not (Test-Path "build/win-onedir/dist/cove-download-manager")) { throw "one-dir bundle missing" }
          Copy-Item cove_dm_icon.png build/win-onedir/dist/cove-download-manager/
          if (Test-Path README.md) { Copy-Item README.md build/win-onedir/dist/cove-download-manager/ }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   build/win-onedir/dist/cove-download-manager/ }

      - name: PyInstaller (one-file portable)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed --onefile `
            --icon cove_dm_icon.ico `
            --name cove-download-manager-portable `
            --paths . `
            --add-data "cove_dm_icon.png;cove" `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onefile/dist `
            --workpath build/win-onefile/work `
            packaging/portable_launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src  = (Resolve-Path "build/win-onedir/dist/cove-download-manager").Path
          $out  = (Resolve-Path "release").Path
          $icon = (Resolve-Path "cove_dm_icon.ico").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=$src" `
            "/DOutputDir=$out" `
            "/DIconFile=$icon" `
            packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Stage portable
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $portSrc = "build/win-onefile/dist/cove-download-manager-portable.exe"
          $portDst = "release/Cove-Download-Manager-$version-Portable.exe"
          Copy-Item -Force $portSrc $portDst
          $clientStage = "build/client-stage/cove-api"
          New-Item -ItemType Directory -Force -Path $clientStage | Out-Null
          Copy-Item tools/cove-api/cove-api.cmd $clientStage/
          Copy-Item tools/cove-api/cove_api.py $clientStage/
          Copy-Item tools/cove-api/wrapper_config.json $clientStage/
          Copy-Item tools/cove-api/README.md $clientStage/
          Copy-Item tools/cove-api/AI_WRAPPER_OPERATING_RULES.md $clientStage/
          Copy-Item tools/cove-api/AI_DIRECT_API_OPERATING_RULES.md $clientStage/
          Compress-Archive -Path "$clientStage/*" -DestinationPath "release/Cove-AI-Client-$version.zip" -Force
          Copy-Item build/aria2-win/aria2-1.37.0-cove.1-source.tar.gz release/
          Get-ChildItem release | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Setup.exe
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Portable.exe
            release/Cove-AI-Client-${{ steps.ver.outputs.version }}.zip
            release/aria2-1.37.0-cove.1-source.tar.gz
          if-no-files-found: error

  # ── Publish GitHub release ─────────────────────────────────────────────
  publish:
    name: Publish GitHub release
    needs: [appimage, deb, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          # The aria2-windows artifact is a build intermediate; its exe is
          # already bundled inside Setup.exe and Portable.exe.
          rm -f release/aria2c.exe
          ls -la release/

      - name: Generate SHA256 sidecars
        run: |
          cd release
          for f in *.exe *.AppImage *.deb *.zip *.tar.gz; do
            [ -e "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'NOTESEOF'
          ## What's new in 3.5.0

          This release is about being able to explain a failure after it happens. Cove could not do that before: the packaged Windows build is windowed, so its Python logging went nowhere, aria2 kept a log nothing surfaced, and the browser extension kept no record at all. A user hitting a broken download could describe it and little else.

          ### Added

          - **Sanitized diagnostics, and a Logs button to read them.** A new Logs button opens a Diagnostics window over the queue, the app's own event log with filters for level, component, task or request id, and free text. Copy diagnostics puts a support-ready report on the clipboard, Save diagnostics writes it to a text file, and Open log folder goes straight to the files. Logs live under the normal data directory (`~/.local/share/cove/logs` on Linux, the portable data folder in portable mode), capped at 2 MB with three rotating backups, so they cannot grow without bound.
          - **View logs on a failed download.** Right-click a failed row and choose View logs to open the Diagnostics window already filtered to that task. The row is not touched: it stays failed, and nothing is retried.
          - **The extension can report a failure while Cove is closed.** This was the gap that made "the pill says Cove is not running" impossible to investigate: if the request never reached Cove, Cove's log has nothing to say about it. The extension now keeps its own bounded record in browser storage, and the popup has Copy diagnostics and Clear diagnostics buttons that work with Cove shut down, the native host unreachable, or native messaging failing outright.
          - **The native messaging host keeps its own log.** It runs as a separate short-lived process, so it writes `native-host.jsonl` beside the app log and never shares a file with the running app. Its stdout stays reserved for the browser protocol. The Diagnostics window merges a tail of it into the same view, labelled `[host]`, so both sides of a browser handoff can be read together.
          - **One request id across all three processes.** A download started from the in-page pill now carries an id from the content script through the background script, the native message, the local socket and into the queue. Filtering on it in the Diagnostics window shows the whole journey and where it stopped. It is optional throughout, so an older extension and a newer app, or the reverse, keep working exactly as before.
          - **Temporary debug logging.** A checkbox in the Diagnostics window turns on extra detail until the app restarts. It is never persisted, and it never turns off redaction.

          ### What the logs will not contain

          Redaction happens before anything is stored, shown, copied or saved, and a redaction step that fails returns a placeholder rather than the original value. Links keep only their scheme, a sanitized host and a route shape, so a Real-Debrid link is recorded as `https://real-debrid.com/d/<redacted>` and a magnet as `magnet:<redacted>`. Query strings, fragments and login details in a URL are dropped outright. File paths keep only their shape: your Windows or Linux user folder becomes `%USERPROFILE%` or `~`, and the random work-directory suffix becomes `.cove-work-<work-id>`. API tokens, cookies, authorization headers and the aria2 RPC secret are never recorded, debrid accounts appear only as "configured: yes or no", and the extension never records a page address, a media address or a tab title.

          There is no telemetry and no upload. Nothing leaves the machine unless you press Copy or Save and send it yourself.

          ### Fixed

          - **Startup errors no longer vanish.** Wiring the app's logger into diagnostics initially silenced the messages Python used to print to the terminal by itself, including the one that explains an unreadable settings file. The terminal output is restored explicitly.

          ### Notes

          - Diagnostics are observation only. Download routing, extractor validation, aria2 behaviour, debrid handling, connection wording and timeouts are all unchanged, and a logging failure can never fail a download or stop the app from starting.
          - Three specific problems reported against 3.4.0 are now diagnosable, though this release deliberately does not change their outcome: the Windows extractor publication failure now records the exact rule that rejected the path, the popup saying Connected while the video pill says Cove is not running now records both sides of that check, and a Real-Debrid generated `/d/` link now records its route class without the account token.
          - Browser extension: Firefox 1.4.5 and Chrome 1.3.5. Store submission is manual, so the store listings update separately from this release.

          ## Downloads

          | Platform | File |
          |----------|------|
          | Linux (AppImage) | `Cove-Download-Manager-VERSION-x86_64.AppImage` |
          | Linux (Debian/Ubuntu) | `cove-download-manager_VERSION_amd64.deb` |
          | Windows installer | `Cove-Download-Manager-VERSION-Setup.exe` |
          | Windows portable | `Cove-Download-Manager-VERSION-Portable.exe` |
          | AI command-line client | `Cove-AI-Client-VERSION.zip` |
          | Patched aria2 source | `aria2-1.37.0-cove.1-source.tar.gz` |

          Each artifact has a matching `.sha256` file for verification.
          NOTESEOF
          sed -i "s/VERSION/${VERSION}/g" "$NOTES_FILE"

          if gh release view "v$VERSION" &>/dev/null; then
            gh release upload "v$VERSION" release/* --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --draft \
              -F "$NOTES_FILE" \
              release/*
          fi
