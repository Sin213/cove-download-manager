name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.0). Leave blank to use cove/__init__.py.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Linux AppImage ─────────────────────────────────────────────────────
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AppImage build tooling
        run: |
          sudo apt-get update
          # libfuse2 is required for the appimagetool AppImage to execute.
          sudo apt-get install -y --no-install-recommends libfuse2 desktop-file-utils
          python -m pip install --upgrade pip
          python -m pip install --user python-appimage
          # build.sh expects appimagetool either at python-appimage's cache
          # path or on PATH. python-appimage --no-packaging skips fetching
          # it, so we install it ourselves into /usr/local/bin.
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build AppImage
        run: |
          export PYAPPIMG="$HOME/.local/bin/python-appimage"
          bash build.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  # ── Linux .deb ─────────────────────────────────────────────────────────
  deb:
    name: Build .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OS build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xz-utils

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-deb.sh

      - name: List artifacts
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: release/cove-download-manager_${{ steps.ver.outputs.version }}_amd64.deb
          if-no-files-found: error

  # ── Windows Setup.exe + Portable.exe (native, no Wine) ────────────────
  aria2-windows:
    name: Build patched Windows aria2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned aria2 source with WinTLS patch
        run: bash scripts/build-aria2-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win/
          if-no-files-found: error

  windows:
    name: Build Windows installers
    needs: aria2-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^__version__' cove/__init__.py | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate cove_dm_icon.ico
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('cove_dm_icon.png').save('cove_dm_icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Download patched aria2 backend
        uses: actions/download-artifact@v4
        with:
          name: aria2-windows
          path: build/aria2-win

      - name: Test patched aria2 TLS policy
        shell: pwsh
        run: scripts/test-aria2-windows-tls.ps1 -Aria2Exe build/aria2-win/aria2c.exe

      - name: Fetch yt-dlp.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/yt-dlp-win | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile build/yt-dlp-win/yt-dlp.exe
          if (-not (Test-Path build/yt-dlp-win/yt-dlp.exe)) { throw "yt-dlp.exe download failed" }

      - name: PyInstaller (one-dir for installer)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed `
            --icon cove_dm_icon.ico `
            --name cove-download-manager `
            --paths . `
            --add-data "cove_dm_icon.png;cove" `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onedir/dist `
            --workpath build/win-onedir/work `
            packaging/launcher.py
          if (-not (Test-Path "build/win-onedir/dist/cove-download-manager")) { throw "one-dir bundle missing" }
          Copy-Item cove_dm_icon.png build/win-onedir/dist/cove-download-manager/
          if (Test-Path README.md) { Copy-Item README.md build/win-onedir/dist/cove-download-manager/ }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   build/win-onedir/dist/cove-download-manager/ }

      - name: PyInstaller (one-file portable)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --log-level WARN `
            --windowed --onefile `
            --icon cove_dm_icon.ico `
            --name cove-download-manager-portable `
            --paths . `
            --add-data "cove_dm_icon.png;cove" `
            --add-data "cove_icon.png;cove" `
            --add-binary "build/aria2-win/aria2c.exe;." `
            --add-binary "build/yt-dlp-win/yt-dlp.exe;." `
            --hidden-import cove `
            --hidden-import cove.app `
            --hidden-import cove.api_server `
            --hidden-import requests `
            --collect-submodules requests `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module tkinter `
            --distpath build/win-onefile/dist `
            --workpath build/win-onefile/work `
            packaging/portable_launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src  = (Resolve-Path "build/win-onedir/dist/cove-download-manager").Path
          $out  = (Resolve-Path "release").Path
          $icon = (Resolve-Path "cove_dm_icon.ico").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=$src" `
            "/DOutputDir=$out" `
            "/DIconFile=$icon" `
            packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Stage portable
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $portSrc = "build/win-onefile/dist/cove-download-manager-portable.exe"
          $portDst = "release/Cove-Download-Manager-$version-Portable.exe"
          Copy-Item -Force $portSrc $portDst
          $clientStage = "build/client-stage/cove-api"
          New-Item -ItemType Directory -Force -Path $clientStage | Out-Null
          Copy-Item tools/cove-api/cove-api.cmd $clientStage/
          Copy-Item tools/cove-api/cove_api.py $clientStage/
          Copy-Item tools/cove-api/wrapper_config.json $clientStage/
          Copy-Item tools/cove-api/README.md $clientStage/
          Copy-Item tools/cove-api/AI_WRAPPER_OPERATING_RULES.md $clientStage/
          Copy-Item tools/cove-api/AI_DIRECT_API_OPERATING_RULES.md $clientStage/
          Compress-Archive -Path "$clientStage/*" -DestinationPath "release/Cove-AI-Client-$version.zip" -Force
          Copy-Item build/aria2-win/aria2-1.37.0-cove.1-source.tar.gz release/
          Get-ChildItem release | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Setup.exe
            release/Cove-Download-Manager-${{ steps.ver.outputs.version }}-Portable.exe
            release/Cove-AI-Client-${{ steps.ver.outputs.version }}.zip
            release/aria2-1.37.0-cove.1-source.tar.gz
          if-no-files-found: error

  # ── Publish GitHub release ─────────────────────────────────────────────
  publish:
    name: Publish GitHub release
    needs: [appimage, deb, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          # The aria2-windows artifact is a build intermediate; its exe is
          # already bundled inside Setup.exe and Portable.exe.
          rm -f release/aria2c.exe
          ls -la release/

      - name: Generate SHA256 sidecars
        run: |
          cd release
          for f in *.exe *.AppImage *.deb *.zip *.tar.gz; do
            [ -e "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'NOTESEOF'
          ## What's new in 3.6.0

          Cove can now find torrents itself. Search is built in, it goes through the same network interface as your downloads, and what you pick lands in the ordinary queue - no external site, no external client, no account anywhere.

          ### Added

          - **Built-in Search for Movies, TV, Anime and Games.** Type a query, pick a category, and every source that covers it is queried at once; the results come back merged, de-duplicated and sorted together, and adding one queues it like any other download.
          - **Seven active Search sources: YTS, Nyaa, FitGirl, SubsPlease, nekoBT, GOG Games and Torrents-CSV.** Movies come from YTS and Torrents-CSV, TV from Torrents-CSV, Anime from Nyaa, SubsPlease and nekoBT, and Games from FitGirl and GOG Games. The list is fixed at build time - nothing is loaded from disk or the network to decide what runs, and there is no indexer to configure.
          - **Search requests use the network interface selected in Cove's Settings**, the same interface downloads are already bound to, rather than going out over whatever adapter happens to be default.

          ### Fixed

          - **The frameless window is easier to grab by its edges.** The resize hit area was tight enough that a corner drag often missed and moved the window instead.
          - **Magnet links that are still fetching metadata behave properly when you remove or restart them.** The metadata task is now tracked through its whole life, so cancelling one during that stage no longer leaves work behind.
          - **Displayed download progress no longer jumps around.** Progress is reported steadily rather than briefly showing a stale or out-of-order position.

          ### Notes

          - The browser extension is published separately, on its own schedule and through the two stores; this desktop release neither contains nor updates it.

          ## Downloads

          | Platform | File |
          |----------|------|
          | Linux (AppImage) | `Cove-Download-Manager-VERSION-x86_64.AppImage` |
          | Linux (Debian/Ubuntu) | `cove-download-manager_VERSION_amd64.deb` |
          | Windows installer | `Cove-Download-Manager-VERSION-Setup.exe` |
          | Windows portable | `Cove-Download-Manager-VERSION-Portable.exe` |
          | AI command-line client | `Cove-AI-Client-VERSION.zip` |
          | Patched aria2 source | `aria2-1.37.0-cove.1-source.tar.gz` |

          Each artifact has a matching `.sha256` file for verification.
          NOTESEOF
          sed -i "s/VERSION/${VERSION}/g" "$NOTES_FILE"

          if gh release view "v$VERSION" &>/dev/null; then
            gh release upload "v$VERSION" release/* --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --draft \
              -F "$NOTES_FILE" \
              release/*
          fi
