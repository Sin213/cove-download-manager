<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exclude site from Cove</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 32px 20px; }
    main { max-width: 520px; margin: 10vh auto 0; }
    h1 { font-size: 1.5rem; overflow-wrap: anywhere; }
    .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
    button { font: inherit; padding: 8px 14px; }
    #confirm { font-weight: 600; }
    #status { min-height: 1.5em; }
  </style>
  <script src="confirm-exclude.js" defer></script>
</head>
<body>
  <main>
    <h1 id="question">Exclude this site?</h1>
    <p>Cove will stop showing the in-page Download with Cove button on this site.</p>
    <p id="status" role="status" aria-live="polite">Loading confirmation…</p>
    <div class="actions">
      <button id="cancel" type="button">Cancel</button>
      <button id="confirm" type="button" disabled>Exclude site</button>
    </div>
  </main>
</body>
</html>
